  <title>Code</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #000;
      color: #e8e8e8;

      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      padding: 32px;
    }

    .page {
      width: 100%;
      max-width: 900px;
    }

    h1 {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -1px;

      margin-bottom: 18px;

      background: linear-gradient(
        110deg,
        #e8e8e8 0%,
        #e8e8e8 40%,
        #8fffe8 48%,
        #cffff5 50%,
        #8fffe8 52%,
        #e8e8e8 60%,
        #e8e8e8 100%
      );

      background-size: 300% 100%;
      background-position: 100% 0;

      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .code-wrap {
      width: 100%;
    }

    textarea {
      width: 100%;
      height: 450px;

      display: block;

      background: #000;
      color: #e8e8e8;

      border: 1px solid #292929;
      border-radius: 8px;

      padding: 16px;

      resize: vertical;
      outline: none;

      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.6;

      transition: border-color 0.2s ease;
    }

    textarea:focus {
      border-color: #8fffe8;
    }

    .copy {
      position: relative;
      display: inline-block;

      margin-top: 14px;

      border: 0;
      background: transparent;

      font-family: inherit;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.5px;

      cursor: pointer;

      background-image: linear-gradient(
        110deg,
        #e8e8e8 0%,
        #e8e8e8 40%,
        #8fffe8 48%,
        #cffff5 50%,
        #8fffe8 52%,
        #e8e8e8 60%,
        #e8e8e8 100%
      );

      background-size: 300% 100%;
      background-position: 100% 0;

      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .copy::after {
      content: "";
      position: absolute;

      left: 0;
      bottom: -5px;

      width: 100%;
      height: 2px;

      background: #8fffe8;
      border-radius: 10px;

      transform: scaleX(0);
      transform-origin: left;

      transition: transform 0.3s ease;
    }

    .copy:hover {
      animation: gloss 0.7s ease forwards;
      transform: translateX(3px);
    }

    .copy:hover::after {
      transform: scaleX(1);
    }

    .copy:active {
      transform: translateX(3px) scale(0.97);
      opacity: 0.7;
    }

    @keyframes gloss {
      from {
        background-position: 100% 0;
      }

      to {
        background-position: 0% 0;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 20px;
      }

      textarea {
        height: 60vh;
      }
    }
  </style>
</head>

  <script>
    async function copyCode() {
      const box = document.getElementById("codeBox");
      const button = document.getElementById("copyButton");

      try {
        await navigator.clipboard.writeText(box.value);
      } catch {
        box.select();
        document.execCommand("copy");
      }

      button.textContent = "copied";

      setTimeout(() => {
        button.textContent = "copy";
      }, 1500);
    }
  </script>
