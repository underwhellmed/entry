<head>
  <meta charset="UTF-8">

  <title>Code</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #000;
      color: #e8e8e8;

      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 80px 32px;
    }

    /* BACK BUTTON */

    .back {
      position: fixed;
      top: 28px;
      left: 32px;

      color: #e8e8e8;
      font-size: 15px;
      font-weight: 500;

      text-decoration: none;

      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }

    .back::after {
      content: "";
      position: absolute;

      left: 0;
      bottom: -5px;

      width: 100%;
      height: 1px;

      background: #8fffe8;

      transform: scaleX(0);
      transform-origin: left;

      transition: transform 0.25s ease;
    }

    .back:hover {
      color: #8fffe8;
      transform: translateX(-2px);
    }

    .back:hover::after {
      transform: scaleX(1);
    }


    /* CODE BOX */

    .code-box {
      width: min(900px, 85vw);

      background: #080808;
      border: 1px solid #181818;
      border-radius: 14px;

      overflow: hidden;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.4);
    }


    /* TOP BAR */

    .code-header {
      height: 52px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 18px;

      border-bottom: 1px solid #181818;
    }

    .code-label {
      color: #777;

      font-size: 12px;
      font-weight: 500;

      letter-spacing: 0.03em;
    }


    /* COPY BUTTON */

    .copy {
      position: relative;

      border: none;
      outline: none;
      background: none;

      color: #aaa;

      font-family: inherit;
      font-size: 13px;
      font-weight: 500;

      cursor: pointer;

      padding: 5px 0;

      transition:
        color 0.2s ease,
        transform 0.15s ease;
    }

    .copy::after {
      content: "";

      position: absolute;

      left: 0;
      bottom: 0;

      width: 100%;
      height: 1px;

      background: #8fffe8;

      transform: scaleX(0);
      transform-origin: left;

      transition: transform 0.25s ease;
    }

    .copy:hover {
      color: #8fffe8;
    }

    .copy:hover::after {
      transform: scaleX(1);
    }

    .copy:active {
      transform: scale(0.94);
    }


    /* CODE */

    .code-content {
      width: 100%;
      max-height: 500px;

      padding: 22px;

      overflow: auto;
    }

    pre {
      margin: 0;

      white-space: pre-wrap;
      word-break: break-word;
    }

    code {
      color: #d8d8d8;

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        Menlo,
        monospace;

      font-size: 13px;
      line-height: 1.7;

      user-select: text;
      cursor: text;
    }


    /* TEXT SELECTION */

    code::selection {
      background: rgba(143, 255, 232, 0.22);
      color: #fff;
    }


    /* SCROLLBAR */

    .code-content::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .code-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .code-content::-webkit-scrollbar-thumb {
      background: #252525;
      border-radius: 10px;
    }

    .code-content::-webkit-scrollbar-thumb:hover {
      background: #333;
    }


    /* MOBILE */

    @media (max-width: 600px) {

      body {
        padding: 70px 16px;
      }

      .back {
        top: 20px;
        left: 20px;
      }

      .code-box {
        width: 100%;
        border-radius: 10px;
      }

      .code-content {
        padding: 16px;
      }

    }

  </style>
</head>

  <script>

    const copyButton = document.getElementById("copyButton");
    const code = document.getElementById("code");

    copyButton.addEventListener("click", async () => {

      try {

        await navigator.clipboard.writeText(
          code.textContent
        );

        copyButton.textContent = "Copied";

        setTimeout(() => {
          copyButton.textContent = "Copy";
        }, 1500);

      } catch {

        /* Fallback for browsers where
           Clipboard API isn't available */

        const range = document.createRange();
        range.selectNodeContents(code);

        const selection = window.getSelection();

        selection.removeAllRanges();
        selection.addRange(range);

        document.execCommand("copy");

        selection.removeAllRanges();

        copyButton.textContent = "Copied";

        setTimeout(() => {
          copyButton.textContent = "Copy";
        }, 1500);

      }

    });

  </script>
