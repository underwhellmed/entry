<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Links</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #000;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      display: flex;
      align-items: center;

      padding-left: 32px;
    }

    .links {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    .link {
      position: relative;
      display: inline-block;

      font-size: 32px;
      font-weight: 600;
      letter-spacing: -1px;

      text-decoration: none;

      /* Text + teal gloss */
      background: linear-gradient(
        110deg,
        #e8e8e8 0%,
        #e8e8e8 40%,
        #8fffe8 48%,
        #cffff5 50%,
        #8fffe8 52%,
        #e8e8e8 60%,
        #e8e8e8 100%
      );

      background-size: 300% 100%;
      background-position: 100% 0;

      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    /* Hidden underline */
    .link::after {
      content: "";
      position: absolute;

      left: 0;
      bottom: -5px;

      width: 100%;
      height: 2px;

      background: #8fffe8;
      border-radius: 10px;

      transform: scaleX(0);
      transform-origin: left;

      transition: transform 0.3s ease;
    }

    /* Hover */
    .link:hover {
      animation: gloss 0.7s ease forwards;
      transform: translateX(3px);
    }

    .link:hover::after {
      transform: scaleX(1);
    }

    /* Click */
    .link:active {
      transform: translateX(3px) scale(0.97);
      opacity: 0.7;
    }

    @keyframes gloss {
      from {
        background-position: 100% 0;
      }

      to {
        background-position: 0% 0;
      }
    }
  </style>
</head>

<body>

  <div class="links">

    <a class="link" href="https://underwhellmed.github.io/entry/tutorial/">
      tutorial
    </a>

    <a class="link" href="https://underwhellmed.github.io/code/">
      code
    </a>

  </div>

</body>
